<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>AI Studio</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;AI Studio&quot;,&quot;short_name&quot;:&quot;AI Studio&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230a0a0a&quot;,&quot;theme_color&quot;:&quot;%23ff5530&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff5530'/%3E%3Cstop offset='100%25' stop-color='%23ea5ec1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23g)'/%3E%3Ctext x='256' y='320' text-anchor='middle' font-size='280' font-family='sans-serif' font-weight='bold' fill='white'%3EA%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200..1000&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;overflow:hidden;overscroll-behavior:none}
:root{
  --f:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --bg:#f8f8fa;--bg2:#eeeef2;--sf:#fff;--sf2:#e8e8ee;
  --tx:#0a0a0a;--tx2:#555;--tx3:#8e8e93;--bd:#e5e5ea;
  --sh:0 2px 16px rgba(0,0,0,.06);--sh2:0 8px 48px rgba(0,0,0,.12);
  --a1:#ff5530;--a2:#ea5ec1;
  --gr:linear-gradient(135deg,#ff5530,#ea5ec1);
  --r:18px;--rs:12px;--rp:9999px;
  --t:.3s cubic-bezier(.4,0,.2,1);
  --hdr:54px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --sr:env(safe-area-inset-right,0px);--sl:env(safe-area-inset-left,0px);
  --fsz:14.5px;--chat-icon-size:32px;
}
[data-theme=dark]{--bg:#0e0e12;--bg2:#16161c;--sf:#1c1c24;--sf2:#282830;--tx:#f2f2f7;--tx2:#a1a1a6;--tx3:#636366;--bd:#33333d;--sh:0 2px 16px rgba(0,0,0,.5);--sh2:0 8px 48px rgba(0,0,0,.7)}
body{font-family:var(--f);background:var(--bg);color:var(--tx);line-height:1.5;transition:background var(--t),color var(--t);-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:var(--f);border:none;background:none;font-size:inherit;color:inherit}
input,textarea,select{font-family:var(--f);font-size:inherit;color:inherit;outline:none;-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--tx3);border-radius:3px}
::selection{background:rgba(234,94,193,.25)}

/* LAYOUT */
.app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}

/* SIDEBAR */
.sidebar{width:300px;min-width:300px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:100;transition:transform var(--t);flex-shrink:0}
.sidebar-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;height:var(--hdr);border-bottom:1px solid var(--bd);flex-shrink:0;padding-top:max(12px,var(--st))}
.sidebar-hdr .logo{font-weight:800;font-size:17px;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-hdr .sb-row{display:flex;gap:6px}
.sidebar-hdr .sb-row button{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--sf2);transition:all var(--t)}
.sidebar-hdr .sb-row button:active{transform:scale(.85)}
.new-chat-btn{width:30px;height:30px;border-radius:50%;background:var(--gr);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.new-chat-btn:active{transform:scale(.85)}
.chat-list{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.chat-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rs);cursor:pointer;transition:all var(--t);margin-bottom:2px;position:relative}
.chat-it:active{background:var(--sf)}.chat-it.on{background:var(--gr);color:#fff}
.chat-it .ci{width:var(--chat-icon-size);height:var(--chat-icon-size);border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-it.on .ci{background:rgba(255,255,255,.2)}
.chat-it .cn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-it .cp{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chat-it.on .cp{color:rgba(255,255,255,.65)}
.chat-it .ct{font-size:10px;color:var(--tx3);white-space:nowrap;flex-shrink:0}
.chat-it.on .ct{color:rgba(255,255,255,.65)}
.chat-it .cd{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--tx3)}
.chat-it:hover .cd{display:flex}.chat-it .cd:hover{background:rgba(255,0,0,.12);color:#ff4444}
.chat-it.on .cd{color:rgba(255,255,255,.6)}.chat-it.on .cd:hover{background:rgba(255,255,255,.15);color:#fff}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);overflow:hidden;position:relative}
.mhdr{display:flex;align-items:center;gap:6px;padding:0 10px;height:var(--hdr);border-bottom:1px solid var(--bd);background:var(--bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0;z-index:10;padding-top:max(0,var(--st))}
.mhdr .menu-btn{display:none;width:34px;height:34px;border-radius:50%;background:var(--sf2);align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mhdr .menu-btn:active{transform:scale(.9)}
.mhdr .cht{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:4px 8px;border-radius:var(--rs);transition:background var(--t)}
.mhdr .cht:active{background:var(--sf2)}
.mhdr .cti{font-weight:700;font-size:15px;background:var(--sf2);border:1.5px solid var(--a2);border-radius:var(--rs);padding:4px 8px;flex:1;display:none}
.msel{font-size:12px;padding:5px 10px;border-radius:var(--rp);background:var(--sf2);border:1px solid var(--bd);color:var(--tx);cursor:pointer;max-width:160px;outline:none;flex-shrink:0}
.ha{display:flex;gap:3px;flex-shrink:0}.ha button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--sf2);transition:all var(--t)}.ha button:active{transform:scale(.88)}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 0 4px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.msgi{max-width:780px;margin:0 auto;padding:0 12px;display:flex;flex-direction:column;min-height:100%}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px 20px;color:var(--tx3)}
.empty .ei{font-size:56px;margin-bottom:14px;opacity:.4}.empty h3{font-size:19px;font-weight:700;color:var(--tx2);margin-bottom:6px}.empty p{font-size:14px;max-width:300px}
.empty .sug{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px;max-width:400px}
.empty .sug button{padding:7px 16px;border-radius:var(--rp);background:var(--sf2);font-size:12px;font-weight:500;transition:all var(--t)}.empty .sug button:active{background:var(--gr);color:#fff;transform:scale(.96)}

/* BUBBLES */
.msg{margin-bottom:12px;animation:in .35s ease;word-break:break-word;overflow-wrap:break-word}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mr{display:flex;gap:8px;margin-bottom:2px;max-width:100%}.mr.r{justify-content:flex-end}.mr.l{justify-content:flex-start}
.ma{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:4px}
.ma.r{background:var(--gr);color:#fff;order:1}.ma.l{background:var(--sf2);color:var(--tx2)}
.mb{max-width:82%;padding:10px 14px;border-radius:var(--r);font-size:var(--fsz);line-height:1.55;word-break:break-word;overflow-wrap:break-word;position:relative}
.mb.r{background:var(--gr);color:#fff;border-bottom-right-radius:4px}
.mb.l{background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:4px}
.mb .mt{white-space:pre-wrap;overflow-wrap:break-word}
.mb .mt p{margin-bottom:6px}.mb .mt p:last-child{margin-bottom:0}
.mm{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.mm button{font-size:11px;padding:3px 10px;border-radius:var(--rp);background:rgba(255,255,255,.18);color:rgba(255,255,255,.85);transition:all var(--t);display:flex;align-items:center;gap:3px;min-height:26px}
.mb.l .mm button{background:var(--sf2);color:var(--tx3)}
.mm button:active{background:var(--gr)!important;color:#fff!important;transform:scale(.95)}
.mmod{font-size:10px;color:var(--tx3);padding:2px 7px;border-radius:var(--rp);background:var(--bd);display:inline-block;margin-top:3px}

/* IMAGES */
.mi{max-width:100%;border-radius:10px;margin-bottom:6px;cursor:pointer;transition:transform var(--t);display:block;max-height:260px;object-fit:cover;width:auto}
.mi:active{transform:scale(.97)}
.iv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;animation:fade .2s ease}
.iv img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* INPUT */
.inp{border-top:1px solid var(--bd);padding:10px 12px;background:var(--bg);flex-shrink:0;padding-bottom:max(10px,var(--sb))}
.ini{max-width:780px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:var(--sf);border-radius:var(--r);border:1.5px solid var(--bd);padding:4px 4px 4px 14px;transition:border var(--t),box-shadow var(--t)}
.ini:focus-within{border-color:var(--a2);box-shadow:0 0 0 4px rgba(234,94,193,.12)}
.ini .iwrp{flex:1;display:flex;flex-direction:column;min-width:0}
.ini textarea{background:transparent;border:none;padding:8px 0;font-size:16px;resize:none;max-height:110px;min-height:22px;line-height:1.5;width:100%;display:block;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap}
.ini textarea::placeholder{color:var(--tx3)}
.sb{width:38px;height:38px;border-radius:50%;background:var(--gr);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--t)}
.sb:active{transform:scale(.85)}.sb:disabled{opacity:.35;transform:none;cursor:not-allowed}
.ia{display:flex;gap:2px;align-items:center}

/* IMAGE PREVIEW */
.ipw{display:none;align-items:center;gap:8px;padding:5px 6px;margin-bottom:4px;background:var(--sf2);border-radius:10px;max-width:240px}
.ipw.sh{display:flex}.ipw img{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0}
.ipw .inm{font-size:11px;color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipw .irm{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);flex-shrink:0;cursor:pointer}
.ipw .irm:active{background:rgba(255,0,0,.1);color:#ff4444}
.upb{position:relative;overflow:hidden;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--tx3)}
.upb:active{background:var(--bd);color:var(--tx)}
.upb input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* TYPING */
.typ{display:none;align-items:center;gap:8px;padding:10px 14px;margin:0 0 12px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);max-width:180px;border-bottom-left-radius:4px;align-self:flex-start}
.typ.on{display:flex;animation:in .3s ease}
.td{display:flex;gap:3px}.td span{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:bo 1.4s infinite}
.td span:nth-child(2){animation-delay:.2s}.td span:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* OVERLAY */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:150;display:none;animation:fade .2s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.ov.sh{display:block}

/* TOAST */
.tc{position:fixed;bottom:max(24px,var(--sb));left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.to{background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:var(--rp);font-weight:600;font-size:13px;box-shadow:0 4px 24px rgba(0,0,0,.2);animation:ti .3s ease,to .3s ease 1.8s forwards;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
@keyframes ti{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes to{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(10px) scale(.95)}}

/* MODAL */
.mod{position:fixed;top:0;left:0;right:0;bottom:0;z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.mod.sh{display:flex}
.modb{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);animation:fade .2s ease}
.modc{position:relative;background:var(--sf);border-radius:var(--r);padding:22px;max-width:440px;width:100%;box-shadow:var(--sh2);animation:in .3s ease;max-height:90vh;overflow-y:auto}
.modc h3{font-size:17px;font-weight:700;margin-bottom:10px}
.modc textarea{width:100%;min-height:80px;padding:10px;border-radius:var(--rs);background:var(--sf2);border:1px solid var(--bd);font-size:12px;font-family:monospace;resize:vertical;margin-bottom:12px;color:var(--tx)}
.ma2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ma2 button{padding:7px 18px;border-radius:var(--rp);font-weight:600;font-size:13px}
.pr1{background:var(--gr);color:#fff}.pr2{background:var(--sf2)}

/* DnD */
.dndOverlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:600;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dndOverlay.sh{display:flex}
.dndOverlay .dndBox{background:var(--sf);border-radius:var(--r);padding:40px;text-align:center;border:2px dashed var(--a2);box-shadow:var(--sh2);margin:20px}
.dndOverlay .dndBox .dndIcon{font-size:48px;margin-bottom:12px}
.dndOverlay .dndBox p{font-size:15px;color:var(--tx2)}

/* ===== SETTINGS PANEL ===== */
.set-panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--sf);z-index:450;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(0,0,0,.15);padding-right:var(--sr)}
.set-panel.sh{transform:translateX(0)}
.set-hdr{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-shrink:0;padding-top:max(16px,var(--st))}
.set-hdr h3{font-size:17px;font-weight:700;flex:1}
.set-hdr .close{width:34px;height:34px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:18px}
.set-hdr .close:active{background:var(--bd)}
.set-body{flex:1;overflow-y:auto;padding:16px 20px 40px;-webkit-overflow-scrolling:touch}
.set-sec{margin-bottom:24px}
.set-sec h4{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}
.set-row:last-child{border:none}
.set-row .lbl{font-size:14px;font-weight:500;flex:1}
.set-row .desc{font-size:12px;color:var(--tx3);margin-top:2px}
.set-row .val{font-size:13px;color:var(--tx3);min-width:40px;text-align:right}
.set-row .val.vch{font-weight:600;color:var(--a2)}
.tog{width:46px;height:28px;border-radius:14px;background:var(--bd);position:relative;cursor:pointer;transition:background var(--t);flex-shrink:0}
.tog.on{background:var(--gr)}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform var(--t)}
.tog.on::after{transform:translateX(18px)}
.srange{width:140px;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--bd);outline:none;cursor:pointer}
.srange::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--gr);box-shadow:0 1px 6px rgba(255,85,48,.3);cursor:pointer}
.srange::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gr);border:none;cursor:pointer}
.set-ta{width:100%;min-height:80px;padding:10px;border-radius:var(--rs);background:var(--sf2);border:1px solid var(--bd);font-size:13px;resize:vertical;color:var(--tx);line-height:1.5;margin-top:8px}
.set-ta:focus{border-color:var(--a2);box-shadow:0 0 0 3px rgba(234,94,193,.1)}
.preset-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.preset-pills button{padding:5px 12px;border-radius:var(--rp);background:var(--sf2);font-size:12px;font-weight:500;border:1.5px solid transparent;transition:all var(--t)}
.preset-pills button.active{border-color:var(--a2);background:rgba(234,94,193,.08);color:var(--a2)}
.preset-pills button:active{transform:scale(.95)}
.set-action{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.set-action button{padding:10px 16px;border-radius:var(--rs);font-weight:600;font-size:14px;text-align:left;transition:all var(--t);display:flex;align-items:center;gap:10px}
.set-action button:active{transform:scale(.98)}
.set-action .sa-danger{color:#ff4444;background:rgba(255,68,68,.06);border:1px solid rgba(255,68,68,.15)}
.set-action .sa-export{background:var(--sf2)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:var(--sf2);border-radius:var(--rs);padding:12px;text-align:center}
.stat-card .stat-val{font-size:22px;font-weight:800;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .stat-lbl{font-size:11px;color:var(--tx3);margin-top:2px}

/* ===== RESPONSIVE: TABLETS LANDSCAPE ===== */
@media(min-width:821px) and (max-height:500px){
  .empty .ei{font-size:36px;margin-bottom:8px}
  .empty h3{font-size:15px}.empty p{display:none}
  .empty .sug{margin-top:10px}
  .msgi{padding:0 20px}
}

/* ===== RESPONSIVE: TABLETS ===== */
@media(min-width:821px){
  .sidebar{transform:none}
  .msgi{max-width:780px}
}

/* ===== RESPONSIVE: LARGE DESKTOP ===== */
@media(min-width:1200px){
  .msgi{max-width:820px}
  .mb{max-width:78%}
}

/* ===== RESPONSIVE: TV ===== */
@media(min-width:1600px){
  .sidebar{width:340px;min-width:340px}
  .mb{max-width:72%}
  .msgi{max-width:900px}
  :root{--chat-icon-size:36px}
}

/* ===== RESPONSIVE: MOBILE ===== */
@media(max-width:820px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:320px;transform:translateX(-100%);z-index:200;box-shadow:4px 0 24px rgba(0,0,0,.15);padding-left:var(--sl)}
  .sidebar.op{transform:translateX(0)}
  .mhdr{padding:0 8px;gap:4px}
  .mhdr .menu-btn{display:flex;width:34px;height:34px}
  .mhdr .cht{font-size:14px;padding:4px 6px}
  .msel{max-width:90px;font-size:11px;padding:4px 6px}

    const a=document.createElement('div');a.className='ma '+(u?'r':'l');a.textContent=u?'U':'AI';

    else{const cb=document.createElement('button');cb.innerHTML='📋';cb.addEventListener('click',()=>cp(msg.content));m.appendChild(cb);const ca=document.createElement('button');ca.innerHTML='📋📋';ca.title='Промпт+Ответ';ca.addEventListener('click',()=>{const prev=c.messages[i-1];cp(prev?'Промпт:\n'+prev.content+(prev.img?' 📷':'')+'\n\nОтвет:\n'+msg.content+' ('+md(msg.model)+')':msg.content)});m.appendChild(ca);const rg=document.createElement('button');rg.innerHTML='🔄';rg.addEventListener('click',()=>reg(i));m.appendChild(rg);if(settings.showModelTag&&msg.model){const tag=document.createElement('span');tag.className='mmod';tag.textContent=md(msg.model);b.appendChild(tag)}}
    b.appendChild(m);if(u){r.appendChild(b);r.appendChild(a)}else{r.appendChild(a);r.appendChild(b)}g.appendChild(r);mi.appendChild(g);
  });
  sb4();
}

function handleFile(file){if(!file)return;if(file.size>20*1024*1024){t('❌ Макс 20MB',3000);return}if(!file.type.startsWith('image/')){t('❌ Только изображения',3000);return}imgFile=file;const r=new FileReader();r.onload=function(e){imgData=e.target.result;ipImg.src=imgData;inm.textContent=file.name;ipw.classList.add('sh');t('👁 AI проанализирует фото',2500)};r.readAsDataURL(file)}

async function send(){
  const text=inp.value.trim();if(!text&&!imgData)return;if(gen)return;
  let c=ac();if(!c){c=cc();activeId=c.id;rcl()}
  if(text)an(c.id,text);addMsg(c.id,'user',text||'',null,imgData||null);
  inp.value='';ar(inp);const hadImg=imgData!==null;clearImg();rm();
  gen=true;sb.disabled=true;
  let typEl=document.createElement('div');typEl.className='typ on';typEl.innerHTML='<div class="td"><span></span><span></span><span></span></div><span class="tt2" style="font-size:12px;color:var(--tx3)">Думаю...</span>';mi.appendChild(typEl);sb4();
  const sel=ms.value;let tries;
  if(hadImg){const vm=VF.filter(m=>isV(m));tries=isV(sel)?[sel,...vm.filter(m=>m!==sel)]:[...vm];tries=[...new Set(tries)];t('👁 Vision-режим',1200)}else{tries=[...new Set([sel,...FM])]}
  let ok=false;
  for(let att=0;att<tries.length;att++){const m=tries[att];if(att>0){const tt2=typEl.querySelector('.tt2');if(tt2)tt2.textContent=`🔄 ${md(m)}...`;await sl(400)}
    try{const resp=await api(text,m,hadImg?imgData:null);typEl.remove();addMsg(c.id,'assistant',resp,m);rm();if(settings.soundNotif)playSound();t(att>0?`✅ ${md(m)}`:'✅ Готово!');ok=true;break}
    catch(err){if(!err.message.includes('429')&&!err.message.includes('503')&&!err.message.includes('перегруж')&&!err.message.includes('лимит')&&!err.message.includes('доступн')&&!err.message.includes('rate')&&!err.message.includes('402')){typEl.remove();t(err.message,3000);gen=false;sb.disabled=false;return}if(att<tries.length-1){const tt2=typEl.querySelector('.tt2');if(tt2)tt2.textContent=`⚠️ ${md(m)}...`}}
    await sl(200);
  }
  if(!ok){typEl.remove();t('❌ Недоступны',4000)}gen=false;sb.disabled=false;
}

async function api(prompt,model,img){
  const langNames={ru:'Русский',en:'English',uz:"O'zbek",kk:'Қазақ',tr:'Türkçe',de:'Deutsch',fr:'Français',es:'Español',zh:'中文',ja:'日本語',ko:'한국어',ar:'العربية'};
  const sysParts=[settings.systemPrompt];if(img)sysParts.push('Пользователь отправил изображение. ВСЕГДА анализируй его детально.');sysParts.push('Отвечай на языке: '+(langNames[settings.language]||'Русский'));
  const msgs=[{role:'system',content:sysParts.join('\n')}];
  if(img){msgs.push({role:'user',content:[{type:'image_url',image_url:{url:img}},{type:'text',text:prompt||'Опиши изображение'}]})}else{msgs.push({role:'user',content:prompt})}
  const res=await fetch(CFG.URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.KEY,'HTTP-Referer':location.origin,'X-Title':'AI Studio'},body:JSON.stringify({model,messages:msgs,max_tokens:settings.maxTokens,temperature:settings.temperature})});
  if(!res.ok){let m=`Ошибка ${res.status}`;if(res.status===401)m='❌ Ключ';else if(res.status===429)m='⚠️ Лимит';else if(res.status===402)m='💳 Не бесплатна';else if(res.status===503)m='🔧 Недоступна';else try{const e=await res.json();if(e.error?.message)m+=': '+e.error.message}catch{};throw new Error(m)}
  const d=await res.json();const c=d.choices?.[0]?.message?.content;if(!c)throw new Error('❌ Пустой ответ');return c;
}

async function reg(idx){const c=ac();if(!c||idx<1)return;const um=c.messages[idx-1];if(um.role!=='user')return;c.messages.splice(idx);sv();rm();gen=true;sb.disabled=true;let typEl=document.createElement('div');typEl.className='typ on';typEl.innerHTML='<div class="td"><span></span><span></span><span></span></div><span class="tt2" style="font-size:12px;color:var(--tx3)">Думаю...</span>';mi.appendChild(typEl);sb4();const tries=um.img?[...new Set([...VF,...FM.filter(m=>isV(m))])]:[...new Set([ms.value,...FM])];for(let att=0;att<tries.length;att++){const m=tries[att];if(att>0){const tt2=typEl.querySelector('.tt2');if(tt2)tt2.textContent=`🔄 ${md(m)}...`;await sl(400)}try{const resp=await api(um.content,m,um.img||null);typEl.remove();addMsg(c.id,'assistant',resp,m,um.img||null);rm();if(settings.soundNotif)playSound();t('✅ Перегенерировано!');gen=false;sb.disabled=false;return}catch(err){if(!err.message.includes('429')&&!err.message.includes('503')&&!err.message.includes('перегруж')&&!err.message.includes('лимит')&&!err.message.includes('rate')){typEl.remove();t(err.message,3000);gen=false;sb.disabled=false;return}if(att<tries.length-1){const tt2=typEl.querySelector('.tt2');if(tt2)tt2.textContent=`⚠️ ${md(m)}...`}}await sl(200)}typEl.remove();t('❌ Не удалось',3000);gen=false;sb.disabled=false}
