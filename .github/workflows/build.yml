name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4 --no-daemon 2>&1 || true

    - name: Build Debug APK
      run: |
        chmod +x gradlew 2>/dev/null || true
        ./gradlew assembleDebug --no-daemon 2>&1 || gradle assembleDebug --no-daemon 2>&1

    - name: Find and Sign APK
      id: get-apk
      run: |
        APK=$(find app/build -name "*.apk" -type f | head -1)
        if [ -z "$APK" ]; then
          echo "❌ No APK found"
          exit 1
        fi
        echo "Found: $APK"

        # Generate debug signing key
        keytool -genkey -v -keystore /tmp/debug.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=AI Studio, OU=Dev, O=Dev" 2>/dev/null

        BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)

        # Align
        $BUILD_TOOLS/zipalign -v -p 4 "$APK" /tmp/app-aligned.apk 2>/dev/null || cp "$APK" /tmp/app-aligned.apk

        # Sign
        mkdir -p app/build/outputs
        $BUILD_TOOLS/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
          --key-pass pass:android --ks-key-alias androiddebugkey \
          --out app/build/outputs/AI-Studio.apk /tmp/app-aligned.apk 2>/dev/null || cp /tmp/app-aligned.apk app/build/outputs/AI-Studio.apk

        echo "apk_path=app/build/outputs/AI-Studio.apk" >> $GITHUB_OUTPUT
        echo "✅ APK ready"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio
        path: app/build/outputs/AI-Studio.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        name: AI Studio ${{ github.ref_name }}
        body: |
          📱 **AI Studio** — бесплатный AI-чат для Android

          ✨ 17 бесплатных моделей
          📷 Vision с фото
          💬 Multi-chat
          ⚙️ Настройки
          🌐 Темная/светлая тема
        artifacts: app/build/outputs/AI-Studio.apk
        artifactContentType: application/vnd.android.package-archive
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        removesArtifacts: true
