name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon 2>&1 || true
        # Fallback: try assembleRelease
        gradle assembleRelease --no-daemon 2>&1 || true
        echo "=== Looking for APKs ==="
        find . -name "*.apk" -type f 2>/dev/null

    - name: Get APK
      id: get-apk
      run: |
        APK=$(find app/build -name "*.apk" -type f | head -1)
        if [ -z "$APK" ]; then
          echo "❌ No APK found"
          exit 1
        fi
        echo "Found: $APK"
        
        # Generate signing key
        keytool -genkey -v -keystore /tmp/debug.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=AI Studio, OU=Dev, O=Dev" 2>/dev/null
        
        BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
        
        # Align
        $BUILD_TOOLS/zipalign -v -p 4 "$APK" /tmp/app-aligned.apk 2>/dev/null || cp "$APK" /tmp/app-aligned.apk
        
        # Sign
        $BUILD_TOOLS/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out app/build/outputs/AI-Studio.apk /tmp/app-aligned.apk 2>/dev/null || cp /tmp/app-aligned.apk app/build/outputs/AI-Studio.apk
        
        echo "apk_path=app/build/outputs/AI-Studio.apk" >> $GITHUB_OUTPUT
        echo "✅ APK ready"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio
        path: app/build/outputs/AI-Studio.apk

    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/AI-Studio.apk
        name: AI Studio v2.0
        body: |
          📱 AI Studio — бесплатный AI-чат для Android
          
          ✨ 17 бесплатных моделей • Vision фото • Multi-chat • Настройки
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
