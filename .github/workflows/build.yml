name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK with Gradle
      run: gradle assembleRelease --no-daemon

    - name: Generate signing key
      run: |
        keytool -genkey -v -keystore /tmp/debug.keystore \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=AI Studio, OU=Dev, O=Dev, L=Unknown, ST=Unknown, C=US"

    - name: Align and sign APK
      run: |
        BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
        echo "Build tools: $BUILD_TOOLS"
        
        UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
        ALIGNED=/tmp/app-aligned.apk
        SIGNED=app/build/outputs/apk/release/AI-Studio.apk
        
        if [ ! -f "$UNSIGNED" ]; then
          echo "APK not found at $UNSIGNED, looking..."
          find app/build -name "*.apk" 2>/dev/null
          exit 1
        fi
        
        $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED" "$ALIGNED"
        $BUILD_TOOLS/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "$SIGNED" "$ALIGNED"
        echo "✅ APK signed: $SIGNED"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Studio-APK
        path: app/build/outputs/apk/release/AI-Studio.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/AI-Studio.apk
        name: AI Studio v2.0
        body: |
          📱 **AI Studio** — бесплатный AI-чат для Android
          
          ## Возможности
          - 🤖 17 бесплатных моделей (Gemma, Nemotron, GPT-OSS)
          - 👁 Vision — анализ фото
          - 💬 Множество чатов
          - ⚙️ Настройки: промпт, temperature, язык
          - 🌙 Тёмная тема
          - 📦 Экспорт/импорт
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
