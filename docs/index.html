<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#101828"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="description" content="S AI — бесплатный AI-чат с 14 моделями"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-touch-fullscreen" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="mobile-web-app-status-bar-style" content="black-translucent"/>
<title>S AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0f1a;--bg2:#111827;--bg3:#1a2236;--bg4:#1f2937;
  --text:#f0f4ff;--text2:#a0aec0;--text3:#6b7a94;
  --accent:#6366f1;--accent2:#818cf8;--accent3:#4f46e5;
  --border:#1e293b;--border2:#2d3a50;
  --user-bg:linear-gradient(135deg,#6366f1,#8b5cf6);
  --ai-bg:#141c2e;
  --radius:12px;--radius-lg:18px;
  --shadow:0 4px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased}
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:100dvh;overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(99,102,241,.3);color:#fff}
textarea,input,button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent2);text-decoration:none}

/* ===== HEADER ===== */
.header{
  height:54px;background:rgba(11,15,26,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;
  flex-shrink:0;z-index:100;position:relative;
}
.header .menu-btn{
  width:36px;height:36px;border-radius:10px;background:var(--bg3);border:none;color:var(--text2);
  display:none;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
  transition:all .2s;flex-shrink:0;
}
.header .menu-btn:active{transform:scale(.92);background:var(--bg4)}
.header .logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.header .logo .icon{
  width:32px;height:32px;border-radius:10px;background:var(--user-bg);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;
}
.header .logo .name{font-weight:700;font-size:16px;color:var(--text);letter-spacing:-.3px}
.header .logo .ver{font-size:11px;color:var(--text3);font-weight:500;margin-left:2px}

.model-pill{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:10px;
  padding:6px 12px;cursor:pointer;transition:all .2s;max-width:200px;
}
.model-pill:hover{border-color:var(--accent);background:var(--bg4)}
.model-pill:active{transform:scale(.97)}
.model-pill .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0}
.model-pill .mname{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.model-pill .arrow{color:var(--text3);font-size:10px;flex-shrink:0}

.settings-btn{
  width:36px;height:36px;border-radius:10px;background:transparent;border:1px solid var(--border2);
  color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:15px;transition:all .2s;flex-shrink:0;
}
.settings-btn:hover{color:var(--text);border-color:var(--accent)}
.settings-btn:active{transform:scale(.92)}

@media(max-width:768px){
  .header .menu-btn{display:flex}
  .header .logo .ver{display:none}
}

/* ===== SIDEBAR ===== */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;display:none;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.sidebar-overlay.show{display:block}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--bg2);z-index:200;
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;border-right:1px solid var(--border);
}
.sidebar.open{transform:translateX(0)}
.sidebar .s-head{
  padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
}
.sidebar .s-head .s-title{font-weight:700;font-size:15px;color:var(--text);flex:1}
.sidebar .s-head .s-close{
  width:32px;height:32px;border-radius:8px;background:transparent;border:none;
  color:var(--text3);font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;
}
.sidebar .s-head .s-close:hover{color:var(--text);background:var(--bg3)}
.sidebar .new-chat{
  margin:12px 16px;padding:10px;border-radius:var(--radius);background:var(--user-bg);
  border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:8px;transition:all .2s;
}
.sidebar .new-chat:active{transform:scale(.97);opacity:.9}
.sidebar .chat-list{flex:1;overflow-y:auto;padding:8px}
.sidebar .chat-item{
  padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;
  gap:10px;transition:all .15s;margin-bottom:2px;
}
.sidebar .chat-item:hover{background:var(--bg3)}
.sidebar .chat-item.active{background:rgba(99,102,241,.12)}
.sidebar .chat-item .ci-icon{
  width:32px;height:32px;border-radius:8px;background:var(--bg4);display:flex;
  align-items:center;justify-content:center;font-size:14px;color:var(--accent2);flex-shrink:0;
}
.sidebar .chat-item .ci-text{flex:1;min-width:0}
.sidebar .chat-item .ci-title{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .chat-item .ci-time{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar .chat-item .ci-del{
  width:28px;height:28px;border-radius:6px;background:transparent;border:none;
  color:var(--text3);font-size:12px;cursor:pointer;display:none;align-items:center;
  justify-content:center;transition:all .15s;flex-shrink:0;
}
.sidebar .chat-item:hover .ci-del{display:flex}
.sidebar .chat-item .ci-del:hover{color:#ef4444;background:rgba(239,68,68,.1)}
.sidebar .s-empty{text-align:center;padding:40px 16px;color:var(--text3);font-size:13px;line-height:1.6}
.sidebar .s-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);text-align:center}

/* Desktop: sidebar always visible as part of layout */
@media(min-width:901px){
  body{flex-direction:row}
  .sidebar{position:relative;transform:none!important;transition:none;width:260px;flex-shrink:0}
  .sidebar-overlay{display:none!important}
  .sidebar .s-close{display:none}
  .main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:100dvh}
}

/* ===== WELCOME ===== */
.welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:20px;
}
.welcome .w-icon{
  width:80px;height:80px;border-radius:24px;background:var(--user-bg);display:flex;
  align-items:center;justify-content:center;font-size:36px;color:#fff;
  box-shadow:0 8px 32px rgba(99,102,241,.3);animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h1{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.welcome p{font-size:15px;color:var(--text2);max-width:400px;line-height:1.6}
.welcome .features{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.welcome .feat{
  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;
  background:var(--bg3);border:1px solid var(--border);font-size:13px;color:var(--text2);
}
.welcome .feat i{color:var(--accent2);font-size:14px}

/* ===== CHAT AREA ===== */
.chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.msg-row{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;margin-top:2px;
}
.msg-row.assistant .msg-avatar{background:var(--bg3);color:var(--accent2)}
.msg-row.user .msg-avatar{background:var(--user-bg);color:#fff;font-size:13px}
.msg-bubble{
  padding:12px 16px;border-radius:var(--radius-lg);font-size:14.5px;line-height:1.65;
  max-width:calc(100% - 50px);word-wrap:break-word;position:relative;
}
.msg-row.assistant .msg-bubble{background:var(--ai-bg);color:var(--text);border:1px solid var(--border)}
.msg-row.user .msg-bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px}
.msg-bubble .msg-time{font-size:10px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:6px}
.msg-row.user .msg-bubble .msg-time{color:rgba(255,255,255,.6);justify-content:flex-end}
.msg-bubble .msg-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.msg-bubble .msg-actions button{
  background:transparent;border:1px solid var(--border2);color:var(--text3);
  padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;transition:all .15s;
}
.msg-bubble .msg-actions button:hover{border-color:var(--accent);color:var(--accent2)}
.msg-bubble .msg-actions button:active{transform:scale(.95)}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.4s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Markdown in messages */
.msg-bubble pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px;line-height:1.5}
.msg-bubble code{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg4);padding:2px 6px;border-radius:4px}
.msg-bubble pre code{background:transparent;padding:0}
.msg-bubble strong{font-weight:600;color:var(--text)}
.msg-row.user .msg-bubble strong{color:#fff}
.msg-bubble ul,.msg-bubble ol{padding-left:20px;margin:6px 0}
.msg-bubble li{margin:3px 0}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{margin:10px 0 6px;font-weight:600}
.msg-bubble h1{font-size:18px}
.msg-bubble h2{font-size:16px}
.msg-bubble h3{font-size:15px}
.msg-bubble a{color:var(--accent2)}
.msg-bubble img.img-attach{display:block;max-width:280px;max-height:260px;width:auto;height:auto;border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.15);object-fit:contain;cursor:pointer;background:rgba(0,0,0,.2)}
.msg-row.user .msg-bubble img.img-attach{border:1px solid rgba(255,255,255,.2);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.msg-row.assistant .msg-bubble img.img-attach{border:1px solid var(--border)}
.msg-bubble img.img-attach:active{transform:scale(.98)}
.img-msg-wrap{margin-bottom:8px;text-align:center;cursor:pointer;line-height:0}
.img-msg-wrap img.img-attach{margin:0 auto;display:block}

/* Video in messages */
.vid-msg-wrap{margin-bottom:8px;text-align:center;line-height:0}
.vid-msg-wrap video.vid-attach{max-width:320px;max-height:260px;border-radius:12px;border:1px solid var(--border);background:#000}
.msg-row.user .vid-msg-wrap video.vid-attach{border:1px solid rgba(255,255,255,.2)}

/* File in messages */
.file-msg-wrap{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);margin-bottom:8px}
.file-icon{width:40px;height:40px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--text3);margin-top:2px}
.file-content-wrap{margin-bottom:8px;max-height:200px;overflow:auto;border-radius:8px;border:1px solid var(--border)}
.file-content-wrap pre{padding:10px;font-size:12px;line-height:1.5;margin:0;white-space:pre-wrap;word-break:break-all}

/* Image lightbox overlay */
.img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:20px;animation:fadeIn .2s}
.img-lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 4px 32px rgba(0,0,0,.5)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== INPUT AREA ===== */
.input-wrap{
  padding:12px 16px 16px;background:var(--bg);border-top:1px solid var(--border);
  flex-shrink:0;
}

/* Attachment preview */
.attachment-preview{
  max-width:760px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:8px 12px;
}
.att-preview-inner{flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.att-preview-inner img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.att-preview-inner video{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.att-preview-inner .att-file-icon{width:56px;height:56px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.att-preview-inner .att-file-info{flex:1;min-width:0}
.att-preview-inner .att-file-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-preview-inner .att-file-size{font-size:11px;color:var(--text3)}
.remove-att{
  width:28px;height:28px;border-radius:50%;background:var(--bg4);border:none;
  color:var(--text3);font-size:12px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:all .15s;
}
.remove-att:hover{color:#ef4444;background:rgba(239,68,68,.1)}

/* Attach menu */
.attach-menu-wrap{position:relative}
.attach-menu{
  position:absolute;bottom:calc(100% + 8px);left:0;background:var(--bg3);border:1px solid var(--border2);
  border-radius:12px;padding:6px;min-width:180px;z-index:50;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.attach-menu.show{display:block}
.am-item{
  padding:10px 14px;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:all .15s;
}
.am-item:hover{background:var(--bg4)}
.am-item:active{transform:scale(.97)}
.input-box{
  max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  background:var(--bg3);border:1px solid var(--border2);border-radius:16px;
  padding:8px 8px 8px 16px;transition:border-color .2s;
}
.input-box:focus-within{border-color:var(--accent)}
.input-box .attach-btn{
  width:36px;height:36px;border-radius:10px;background:transparent;border:none;
  color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;flex-shrink:0;
}
.input-box .attach-btn:hover{color:var(--accent2)}
.input-box .attach-btn:active{transform:scale(.9)}
.input-box textarea{
  flex:1;background:transparent;border:none;color:var(--text);font-size:15px;
  resize:none;max-height:120px;min-height:24px;line-height:1.5;padding:6px 0;
  outline:none;
}
.input-box textarea::placeholder{color:var(--text3)}
.input-box .send-btn{
  width:40px;height:40px;border-radius:12px;background:var(--user-bg);border:none;
  color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;flex-shrink:0;opacity:.4;pointer-events:none;
}
.input-box .send-btn.ready{opacity:1;pointer-events:auto}
.input-box .send-btn:active{transform:scale(.9)}
.input-box .send-btn.stop{background:#ef4444;opacity:1;pointer-events:auto}
.img-preview-bar{
  max-width:760px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;
}
.img-preview-bar img{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.img-preview-bar .remove-img{
  width:24px;height:24px;border-radius:50%;background:var(--bg4);border:none;
  color:var(--text3);font-size:12px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;
}

@media(max-width:768px){
  .messages{padding:16px 12px}
  .input-wrap{padding:10px 12px 14px}
  .input-box{padding:6px 6px 6px 12px}
}

/* ===== MODEL PICKER MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal-overlay.show{display:flex}
.modal-sheet{
  background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;
  width:100%;max-width:500px;max-height:80vh;display:flex;flex-direction:column;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet .ms-head{
  padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;
}
.modal-sheet .ms-head h3{font-size:16px;font-weight:600;flex:1}
.modal-sheet .ms-head .ms-close{
  width:32px;height:32px;border-radius:8px;background:var(--bg3);border:none;
  color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;
}
.modal-sheet .ms-body{flex:1;overflow-y:auto;padding:12px}
.model-option{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  cursor:pointer;transition:all .15s;border:1px solid transparent;
}
.model-option:hover{background:var(--bg3)}
.model-option.selected{background:rgba(99,102,241,.1);border-color:var(--accent)}
.model-option .mo-icon{
  width:36px;height:36px;border-radius:10px;background:var(--bg4);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--accent2);flex-shrink:0;
}
.model-option .mo-info{flex:1;min-width:0}
.model-option .mo-name{font-size:14px;font-weight:500;color:var(--text)}
.model-option .mo-desc{font-size:12px;color:var(--text3);margin-top:2px}
.model-option .mo-check{color:var(--accent2);font-size:16px;display:none}
.model-option.selected .mo-check{display:block}
.model-section{font-size:12px;font-weight:600;color:var(--text3);padding:8px 12px;text-transform:uppercase;letter-spacing:.5px}

/* ===== SETTINGS MODAL ===== */
.settings-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;
  align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.settings-overlay.show{display:flex}
.settings-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:440px;max-height:85vh;display:flex;flex-direction:column;
  overflow:hidden;animation:scaleIn .25s cubic-bezier(.4,0,.2,1);
}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.settings-card .sc-head{
  padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;
}
.settings-card .sc-head h3{font-size:16px;font-weight:600;flex:1}
.settings-card .sc-head .sc-close{
  width:32px;height:32px;border-radius:8px;background:var(--bg3);border:none;
  color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;
}
.settings-card .sc-body{padding:16px 20px;overflow-y:auto;flex:1}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.field input,.field select{
  width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  border-radius:10px;padding:10px 14px;font-size:14px;transition:border-color .2s;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--text3);margin-top:4px}
.app-info-card{
  background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;
  margin-top:8px;
}
.app-info-card .ai-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.app-info-card .ai-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.app-info-card .ai-label{color:var(--text3)}
.app-info-card .ai-val{color:var(--text);font-weight:500}
.settings-card .sc-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.settings-card .sc-foot .btn-save{
  flex:1;padding:10px;border-radius:10px;background:var(--user-bg);border:none;
  color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;
}
.settings-card .sc-foot .btn-save:active{transform:scale(.97)}
.settings-card .sc-foot .btn-cancel{
  padding:10px 16px;border-radius:10px;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);font-size:14px;cursor:pointer;transition:all .2s;
}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg4);color:var(--text);border:1px solid var(--border2);
  padding:8px 16px;border-radius:10px;font-size:13px;z-index:400;
  opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
// ===== CONFIG =====
const CFG={
  API:'https://openrouter.ai/api/v1/chat/completions',
  KEY:atob('c2stb3ItdjEtMzc5MGY2YTdjMmFhMjNmNzc3NDE5YTFlOWI2NTdmYzc1MTE2NTVmMzQ3MGQ0OGQ0ZjFhNDU1ZjQ5Mjk4NTQxMg=='),

    {id:'poolside/laguna-xs-2.1:free',n:'Poolside Laguna XS 2.1',d:'Poolside · 33B MoE · Кодинг · 262K ctx',icon:'🌊'}
  ],
  VISION_IDS:['google/gemma-4-31b-it:free','google/gemma-4-26b-a4b-it:free','nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free','nvidia/nemotron-nano-12b-v2-vl:free','nvidia/nemotron-3.5-content-safety:free'],
  SUGGESTIONS:['Что ты умеешь?','Объясни квантовую физику','Напиши стих о технологиях','План на день','Факт о космосе','Идея для проекта']
};

// ===== STATE =====
const S={chats:{},curId:null,msgs:[],model:CFG.MODELS[0].id,theme:'dark',loading:false,abort:null,img:null,video:null,file:null,fileName:'',fileSize:0};

// ===== LIGHTBOX =====
function openLightbox(el){
  const src=el.getAttribute('data-src');
  if(!src)return;
  const ov=document.createElement('div');
  ov.className='img-lightbox';
  const full=document.createElement('img');
  full.src=src;
  ov.appendChild(full);
  ov.addEventListener('click',()=>ov.remove());
  document.body.appendChild(ov);
}
function openLightboxSrc(src){
  if(!src)return;
  const ov=document.createElement('div');
  ov.className='img-lightbox';
  const full=document.createElement('img');
  full.src=src;
  ov.appendChild(full);
  ov.addEventListener('click',()=>ov.remove());
  document.body.appendChild(ov);
}

// ===== HELPERS =====
const $=id=>document.getElementById(id);
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const time=()=>new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};

function renderMd(text){
  if(!text)return'';
  let h=esc(text);
  h=h.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  h=h.replace(/\n/g,'<br>');
  return h;
}

// ===== PERSISTENCE =====
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('sai_set')||'{}');
    if(s.model&&CFG.MODELS.some(m=>m.id===s.model))S.model=s.model;
    S.theme=s.theme||'dark';
    if(s.key&&s.key.trim())CFG.KEY=s.key.trim();
    // Автосохранение встроенного ключа если localStorage пуст
    if(!s.key)saveSettings();
  }catch(e){saveSettings()}
}
function saveSettings(){
  localStorage.setItem('sai_set',JSON.stringify({model:S.model,theme:S.theme,key:CFG.KEY}));
}
function loadChats(){
  try{
    const d=JSON.parse(localStorage.getItem('sai_chats')||'{}');
    S.chats=d;
    const ids=Object.keys(d);
    S.curId=ids[0]||null;
    S.msgs=S.curId?(d[S.curId].msgs||[]):[];
  }catch(e){S.chats={};S.curId=null;S.msgs=[]}
}
function saveChats(){localStorage.setItem('sai_chats',JSON.stringify(S.chats))}
function saveCurrent(){if(S.curId&&S.chats[S.curId])S.chats[S.curId].msgs=S.msgs;saveChats()}

// ===== CHAT CRUD =====
function createChat(title){
  const id='c'+Date.now();
  S.chats[id]={id,title,msgs:[],ts:Date.now()};
  saveChats();switchChat(id);
}
function switchChat(id){
  if(!S.chats[id])return;
  S.curId=id;S.msgs=S.chats[id].msgs||[];
  saveChats();renderChatList();renderMessages();closeSidebar();
}
function deleteChat(id){
  delete S.chats[id];
  if(S.curId===id){const ids=Object.keys(S.chats);S.curId=ids[0]||null;S.msgs=S.curId?(S.chats[S.curId].msgs||[]):[]}
  saveChats();renderChatList();renderMessages();
}

// ===== RENDER =====
function renderChatList(){
  const list=$('chatList');list.innerHTML='';
  const ids=Object.keys(S.chats).sort((a,b)=>(S.chats[b].ts||0)-(S.chats[a].ts||0));
  if(!ids.length){list.innerHTML='<div class="s-empty">Пока нет чатов<br/>Нажмите «Новый чат» чтобы начать</div>';return}
  ids.forEach(id=>{
    const c=S.chats[id];
    const d=document.createElement('div');
    d.className='chat-item'+(id===S.curId?' active':'');
    d.innerHTML=`<div class="ci-icon">💬</div><div class="ci-text"><div class="ci-title">${esc(c.title||'Новый чат')}</div><div class="ci-time">${new Date(c.ts||Date.now()).toLocaleDateString('ru')}</div></div><button class="ci-del" data-id="${id}">🗑</button>`;
    d.addEventListener('click',e=>{if(!e.target.closest('.ci-del'))switchChat(id)});
    d.querySelector('.ci-del').addEventListener('click',e=>{e.stopPropagation();deleteChat(id)});
    list.appendChild(d);
  });
}

function renderMessages(){
  const mc=$('messages');mc.innerHTML='';
  if(!S.msgs.length){
    mc.innerHTML=`<div class="welcome"><div class="w-icon">✦</div><h1>Привет! Я S AI</h1><p>Задайте любой вопрос — я помогу с текстом, кодом, идеями и творческими задачами</p><div class="features"><div class="feat">🆓 14 FREE модели</div><div class="feat">🖼 Vision / изображения</div><div class="feat">💾 Чаты сохраняются</div><div class="feat">🔑 API подключён</div></div></div>`;
    renderSuggestions(mc);
    return;
  }
  S.msgs.forEach((m,i)=>{
    const row=document.createElement('div');
    row.className='msg-row '+m.role;

    const av=document.createElement('div');
    av.className='msg-avatar';
    av.innerHTML=m.role==='user'?'👤':'✦';
    row.appendChild(av);

    const bub=document.createElement('div');
    bub.className='msg-bubble';

    if(m.role==='assistant'&&(m.loading||!m.content)){
      bub.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
    }else{
      let content='';

      // Изображение
      if(m.img){
        content+='<div class="img-msg-wrap"><img class="img-attach" data-img="1" alt="Изображение"/></div>';
      }

      // Видео
      if(m.video){
        content+='<div class="vid-msg-wrap"><video class="vid-attach" controls playsinline preload="metadata" data-vid="1"></video></div>';
      }

      // Файл
      if(m.file){
        const fc=m.file;
        content+='<div class="file-msg-wrap"><div class="file-icon">📄</div><div class="file-info"><div class="file-name">'+esc(fc.name)+'</div><div class="file-size">'+formatSize(fc.size)+'</div></div></div>';
        if(fc.content){content+='<div class="file-content-wrap"><pre><code>'+esc(fc.content.slice(0,8000))+'</code></pre></div>';}
      }

      content+=renderMd(m.content||'');
      bub.innerHTML=content;

      // Устанавливаем src изображения ПОСЛЕ innerHTML
      if(m.img){
        const img=bub.querySelector('img[data-img]');
        if(img){img.src=m.img;img.parentElement.onclick=()=>openLightboxSrc(m.img)}
      }

      // Устанавливаем src видео ПОСЛЕ innerHTML
      if(m.video){
        const vid=bub.querySelector('video[data-vid]');
        if(vid){vid.src=m.video}
      }

      const meta=document.createElement('div');
      meta.className='msg-time';
      meta.textContent=time();
      bub.appendChild(meta);

      if(m.role==='assistant'){
        const actions=document.createElement('div');
        actions.className='msg-actions';
        actions.innerHTML=`<button data-c="${i}">📋 Копировать</button><button data-r="${i}">🔄 Заново</button><button data-e="1">📥 TXT</button>`;
        actions.addEventListener('click',e=>{
          const btn=e.target.closest('button');if(!btn)return;
          if(btn.dataset.c!=null){
            navigator.clipboard?.writeText(m.content).then(()=>toast('Скопировано!')).catch(()=>{});
          }
          if(btn.dataset.r!=null){
            let ut='';
            for(let j=i-1;j>=0;j--){if(S.msgs[j].role==='user'){ut=S.msgs[j].content||'';break}}
            S.msgs.splice(i);saveCurrent();renderMessages();
            const inp=$('msgInput');inp.value=ut;inp.focus();checkSendReady();
          }
          if(btn.dataset.e!=null){
            const txt=S.msgs.map(x=>`[${x.role==='user'?'Вы':'AI'}]: ${x.content}`).join('\n\n');
            const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
            const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chat.txt';a.click();
            toast('Экспорт завершён');
          }
        });
        bub.appendChild(actions);
      }
    }
    row.appendChild(bub);
    mc.appendChild(row);
  });
  mc.scrollTop=mc.scrollHeight;
}

function renderSuggestions(parent){
  const w=parent||$('messages');
  let el=w.querySelector('.welcome-sugs');
  if(!el){
    el=document.createElement('div');
    el.className='welcome-sugs';
    el.style.cssText='display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px;margin-top:4px';
    const welcomeDiv=w.querySelector('.welcome');
    if(welcomeDiv)welcomeDiv.appendChild(el);
  }
  el.innerHTML='';
  CFG.SUGGESTIONS.forEach(s=>{
    const b=document.createElement('button');
    b.style.cssText='background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s';
    b.textContent=s;
    b.addEventListener('click',()=>{$('msgInput').value=s;checkSendReady();$('msgInput').focus()});
    b.addEventListener('mouseenter',()=>{b.style.borderColor='var(--accent)';b.style.color='var(--text)'});
    b.addEventListener('mouseleave',()=>{b.style.borderColor='var(--border)';b.style.color='var(--text2)'});
    el.appendChild(b);
  });
}

function checkSendReady(){
  const btn=$('sendBtn');
  const hasText=$('msgInput').value.trim().length>0;
  const hasAtt=!!S.img||!!S.video||!!S.file;
  btn.classList.toggle('ready',hasText||hasAtt);
}

// ===== API =====
function getModelId(){
  // Автоматический выбор модели по типу вложения
  if(S.img||S.video){
    const visionModels=['google/gemma-4-31b-it:free','google/gemma-4-26b-a4b-it:free','nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free','nvidia/nemotron-nano-12b-v2-vl:free'];
    if(visionModels.includes(S.model))return S.model;
    return visionModels[0]; // Gemma 4 31B по умолчанию
  }
  return S.model;
}

function buildApiMessages(text){
  const parts=[];
  if(S.img){
    parts.push({type:'image_url',image_url:{url:S.img,detail:'auto'}});
  }
  if(S.video){
    parts.push({type:'image_url',image_url:{url:S.video,detail:'auto'}});
  }
  if(parts.length>0){
    if(text)parts.unshift({type:'text',text:text});
    return[{role:'user',content:parts}];
  }
  if(S.file){
    const fileMsg='[Файл: '+S.fileName+' ('+formatSize(S.fileSize)+')]\n\n'+S.fileContent;
    return[{role:'user',content:(text?text+'\n\n':'')+fileMsg}];
  }
  return[{role:'user',content:text}];
}

function formatSize(bytes){
  if(bytes<1024)return bytes+' B';
  if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
  return(bytes/1048576).toFixed(1)+' MB';
}

function getApiHistory(){
  const hist=[];
  const recent=S.msgs.filter(m=>!m.loading).slice(-20);
  for(const m of recent){
    if(m.role==='assistant'&&m.content)hist.push({role:'assistant',content:m.content});
    if(m.role==='user'){
      if(m.img){
        hist.push({role:'user',content:[{type:'text',text:m.content||'Опиши изображение'},{type:'image_url',image_url:{url:m.img,detail:'auto'}}]});
      }else if(m.video){
        hist.push({role:'user',content:[{type:'text',text:m.content||'Опиши видео'},{type:'image_url',image_url:{url:m.video,detail:'auto'}}]});
      }else{
        let c=m.content||'';
        if(m.file)c+='[Файл: '+m.file.name+']';
        hist.push({role:'user',content:c});
      }
    }
  }
  return hist;
}

async function sendMessage(){
  if(S.loading){stopGeneration();return}
  const inp=$('msgInput');
  const text=inp.value.trim();
  if(!text&&!S.img&&!S.video&&!S.file){inp.focus();return}
  if(!S.curId)createChat('Новый чат');

  // hide welcome
  const w=$('messages').querySelector('.welcome');
  if(w)w.remove();

  const userMsg={role:'user',content:text,ts:Date.now()};
  if(S.img)userMsg.img=S.img;
  if(S.video)userMsg.video=S.video;
  if(S.file)userMsg.file={name:S.fileName,size:S.fileSize,content:S.fileContent};
  S.msgs.push(userMsg);
  saveCurrent();

  inp.value='';inp.style.height='auto';
  const attImg=S.img;const attVideo=S.video;const attFile=S.file;const attFileName=S.fileName;const attFileSize=S.fileSize;
  S.img=null;S.video=null;S.file=null;S.fileName='';S.fileSize=0;
  $('attachmentPreview').style.display='none';
  $('attPreviewInner').innerHTML='';
  checkSendReady();
  renderMessages();

  S.loading=true;
  const loadMsg={role:'assistant',content:'',loading:true,ts:Date.now()};
  S.msgs.push(loadMsg);
  renderMessages();

  // auto-title
  if(S.msgs.filter(m=>m.role==='user').length===1&&S.curId&&S.chats[S.curId]){
    S.chats[S.curId].title=text.slice(0,40)+(text.length>40?'...':'');
    saveChats();renderChatList();
  }

  try{
    const model=getModelId();
    const history=getApiHistory();
    const savedImg=attImg;const savedVideo=attVideo;const savedFile=attFile;
    // Временно возвращаем вложения для API
    S.img=savedImg;S.video=savedVideo;S.file=savedFile;S.fileName=attFileName;S.fileSize=attFileSize;
    const userMsgs=buildApiMessages(text);
    S.img=null;S.video=null;S.file=null;S.fileName='';S.fileSize=0;
    const messages=[...history.slice(0,-1),...userMsgs];

    S.abort=new AbortController();
    const key=CFG.KEY||'';
    const res=await fetch(CFG.API,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'HTTP-Referer':location.origin},
      body:JSON.stringify({model,messages,max_tokens:2048,temperature:0.7,top_p:0.9}),
      signal:S.abort.signal
    });
    if(!res.ok){
      const errText=await res.text();
      let errMsg='Ошибка: '+res.status;
      try{const e=JSON.parse(errText);errMsg=e.error?.message||errMsg}catch(x){}
      throw new Error(errMsg);
    }
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||'Нет ответа от модели';

    const last=S.msgs[S.msgs.length-1];
    if(last&&last.loading){last.content=reply;last.loading=false;last.ts=Date.now()}
    saveCurrent();renderMessages();
    setTimeout(()=>$('msgInput').focus(),100);
  }catch(err){
    if(err.name==='AbortError'){
      const last=S.msgs[S.msgs.length-1];
      if(last&&last.loading){last.content='[Прервано]';last.loading=false}
      saveCurrent();renderMessages();
    }else{
      const last=S.msgs[S.msgs.length-1];
      if(last&&last.loading){last.content='⚠️ '+err.message;last.loading=false}
      saveCurrent();renderMessages();toast(err.message);
    }
  }finally{
    S.loading=false;S.abort=null;checkSendReady();
    setTimeout(()=>$('msgInput').focus({preventScroll:true}),200);
  }
}

function stopGeneration(){if(S.abort)S.abort.abort()}

// ===== MODEL PICKER =====
function renderModelList(){
  const list=$('modelList');list.innerHTML='';
  // Заголовок
  const hdr=document.createElement('div');
  hdr.className='model-section';
  hdr.textContent='🆓 Все модели бесплатные (OpenRouter Free)';
  hdr.style.cssText='font-size:14px;padding:8px 12px 12px;color:#22c55e;font-weight:600';
  list.appendChild(hdr);

  CFG.MODELS.forEach(m=>{
    const d=document.createElement('div');
    d.className='model-option'+(m.id===S.model?' selected':'');
    d.innerHTML=`<div class="mo-icon">${m.icon}</div><div class="mo-info"><div class="mo-name">${m.n} <span style="color:#22c55e;font-size:11px;background:rgba(34,197,94,.15);padding:2px 6px;border-radius:4px;margin-left:6px">FREE</span></div><div class="mo-desc">${m.d}</div></div><div class="mo-check">✓</div>`;
    d.addEventListener('click',()=>{
      S.model=m.id;saveSettings();
      $('modelPillName').textContent=m.n;
      document.querySelectorAll('.model-option').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');
      toast('✅ Модель: '+m.n+' (FREE)');
      setTimeout(()=>closeModelModal(),200);
    });
    list.appendChild(d);
  });
}

function openModelModal(){
  renderModelList();$('modelModal').classList.add('show');
}
function closeModelModal(){$('modelModal').classList.remove('show')}

// ===== SIDEBAR =====
function openSidebar(){$('sidebar').classList.add('open');$('sidebarOverlay').classList.add('show')}
function closeSidebar(){$('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('show')}

// ===== SETTINGS =====
function openSettings(){
  $('apiKeyInput').value=CFG.KEY||'';
  $('themeSelect').value=S.theme;
  const hint=$('apiKeyHint');
  if(CFG.KEY){hint.textContent='Ключ уже встроен в приложение ✅';hint.style.color='#22c55e'}
  else{hint.textContent='Введите ключ из openrouter.ai/keys';hint.style.color='var(--text3)'}
  $('settingsModal').classList.add('show');
}
function closeSettings(){$('settingsModal').classList.remove('show')}
function saveSettingsUI(){
  const k=$('apiKeyInput').value.trim();
  if(k&&k.startsWith('sk-'))CFG.KEY=k;
  S.theme=$('themeSelect').value;
  applyTheme();saveSettings();closeSettings();toast('Настройки сохранены');
}
function applyTheme(){document.body.classList.toggle('light',S.theme==='light')}

// ===== EVENT BINDING =====
function bindEvents(){
  // Menu
  $('menuBtn').addEventListener('click',openSidebar);
  $('sidebarOverlay').addEventListener('click',closeSidebar);
  $('sidebarClose').addEventListener('click',closeSidebar);
  $('newChatBtn').addEventListener('click',()=>createChat('Новый чат'));

  // Send
  $('sendBtn').addEventListener('click',sendMessage);
  $('sendBtn').addEventListener('touchstart',e=>{e.preventDefault();sendMessage()});

  // Input
  const inp=$('msgInput');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  inp.addEventListener('input',function(){
    this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
    checkSendReady();
  });

  // Attach menu toggle
  const attachBtn=$('attachBtn');
  const attachMenu=$('attachMenu');
  attachBtn.addEventListener('click',e=>{e.stopPropagation();attachMenu.classList.toggle('show')});
  document.addEventListener('click',()=>attachMenu.classList.remove('show'));

  // Attach menu items
  document.querySelectorAll('.am-item').forEach(item=>{
    item.addEventListener('click',e=>{
      e.stopPropagation();
      attachMenu.classList.remove('show');
      const type=item.dataset.type;
      if(type==='image')$('fileInputImage').click();
      else if(type==='video')$('fileInputVideo').click();
      else if(type==='file')$('fileInputFile').click();
    });
  });

  // File inputs
  $('fileInputImage').addEventListener('change',function(){if(this.files[0])handleImage(this.files[0]);this.value=''});
  $('fileInputVideo').addEventListener('change',function(){if(this.files[0])handleVideo(this.files[0]);this.value=''});
  $('fileInputFile').addEventListener('change',function(){if(this.files[0])handleFile(this.files[0]);this.value=''});

  // Remove attachment
  $('removeAtt').addEventListener('click',()=>{clearAttachment()});

  // Model picker
  $('modelPill').addEventListener('click',openModelModal);
  $('modelModalClose').addEventListener('click',closeModelModal);
  $('modelModal').addEventListener('click',e=>{if(e.target===$('modelModal'))closeModelModal()});

  // Settings
  $('settingsBtn').addEventListener('click',openSettings);
  $('settingsClose').addEventListener('click',closeSettings);
  $('settingsCancel').addEventListener('click',closeSettings);
  $('settingsSave').addEventListener('click',saveSettingsUI);
  $('settingsModal').addEventListener('click',e=>{if(e.target===$('settingsModal'))closeSettings()});

  // Click input area focuses
  $('inputBox').addEventListener('click',e=>{if(e.target!==inp)inp.focus()});

  // Keyboard
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      const h=window.visualViewport.height;
      if(S.msgs.length){const mc=$('messages');setTimeout(()=>mc.scrollTop=mc.scrollHeight,100)}
      if(!S.loading)$('msgInput').focus();
    });
  }

  // Prevent zoom
  document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
  if(/iPhone|iPad|iPod/.test(navigator.userAgent))document.addEventListener('gesturechange',e=>e.preventDefault());
}

function clearAttachment(){
  S.img=null;S.video=null;S.file=null;S.fileName='';S.fileSize=0;
  $('attachmentPreview').style.display='none';
  $('attPreviewInner').innerHTML='';
  checkSendReady();
}

function showImagePreview(src){
  const inner=$('attPreviewInner');
  inner.innerHTML='<img src="'+src+'" alt="preview"/>';
  $('attachmentPreview').style.display='flex';
}

function showVideoPreview(src){
  const inner=$('attPreviewInner');
  inner.innerHTML='<video src="'+src+'" muted playsinline preload="metadata"></video>';
  $('attachmentPreview').style.display='flex';
}

function showFilePreview(name,size){
  const inner=$('attPreviewInner');
  inner.innerHTML='<div class="att-file-icon">📄</div><div class="att-file-info"><div class="att-file-name">'+esc(name)+'</div><div class="att-file-size">'+formatSize(size)+'</div></div>';
  $('attachmentPreview').style.display='flex';
}

function handleImage(file){
  try{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX}}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        S.img=canvas.toDataURL('image/jpeg',0.85);
        showImagePreview(S.img);
        checkSendReady();
        toast('🖼 Изображение: '+w+'×'+h);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }catch(e){toast('Ошибка загрузки')}
}

function handleVideo(file){
  try{
    const reader=new FileReader();
    reader.onload=()=>{
      S.video=reader.result;
      S.fileName=file.name;
      S.fileSize=file.size;
      showVideoPreview(S.video);
      checkSendReady();
      toast('🎬 Видео: '+file.name);
    };
    reader.readAsDataURL(file);
  }catch(e){toast('Ошибка загрузки видео')}
}

function handleFile(file){
  try{
    const sizeMB=file.size/(1024*1024);
    if(sizeMB>2){toast('Файл слишком большой (макс 2 МБ)');return}
    const reader=new FileReader();
    reader.onload=()=>{
      S.file=true;
      S.fileName=file.name;
      S.fileSize=file.size;
      S.fileContent=reader.result;
      showFilePreview(file.name,file.size);
      checkSendReady();
      toast('📄 Файл: '+file.name);
    };
    reader.readAsText(file);
  }catch(e){toast('Ошибка чтения файла')}
}

// ===== FOCUS WATCHDOG =====
function startFocusWatchdog(){
  setInterval(()=>{
    if(document.activeElement===document.body&&!S.loading){
      $('msgInput').focus({preventScroll:true});
    }
  },200);
}

// ===== INIT =====
function init(){
  loadSettings();applyTheme();
  const m=CFG.MODELS.find(x=>x.id===S.model)||CFG.MODELS[0];
  $('modelPillName').textContent=m.n;
  loadChats();renderChatList();renderMessages();
  bindEvents();startFocusWatchdog();
  checkSendReady();
  console.log('🚀 S AI v'+CFG.VERSION+' ready');
}

function boot(){try{init()}catch(e){console.error('Init:',e);setTimeout(boot,500)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body>
